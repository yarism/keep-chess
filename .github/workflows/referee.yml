# Every move in the world's game arrives as an issue; this is the referee
# picking it up. The title guard keeps ordinary issues from waking it, and the
# reset to origin/main means a run that sat queued behind another move still
# judges against the position that move produced.
name: Referee
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
jobs:
  move:
    if: startsWith(github.event.issue.title, 'keep-chess')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git fetch origin main && git reset --hard origin/main
      - run: node scripts/referee.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          ISSUE_AUTHOR_ID: ${{ github.event.issue.user.id }}
